# --------------------------------
# OSNOVNI PODACI ZA KONEKCIJU NA BAZU
# --------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/raflms?serverTimezone=Europe/Belgrade&createDatabaseIfNotExist=true&useSSL=true&requireSSL=true
# DB_USERNAME i DB_PASSWORD su environment variables tkd podesavas ih u run properties
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# pravi bazu pri pokretanju programa i brise je pri gasenju
spring.jpa.hibernate.ddl-auto=create-drop

# --------------------------------
# DEBUG LOGOVANJE
# --------------------------------
# loguje sql stejtmente u terminal
spring.jpa.show-sql=true
# formatiranje logovanog sql-a (da bude citljivije)
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------
# OSTALO
# --------------------------------
# na prez pise da ovo nije obavezno
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# nzm da li nam ovo treba nmg da se setim imamo li tabele bez primarnog kljuca u bazi
spring.datasource.hikari.connectionInitSql=SET SESSION sql_require_primary_key=0
# Safer default: don't keep the session open across view rendering
spring.jpa.open-in-view=false