spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# provereva semu baze da li se slaze sa nasim entitetima, ako se ne slaze ne modifikuje je vec baca exception
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-trajanje=${JWT_TRAJANJE:1h}
app.security.cors-origins=${CORS_ORIGINS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.hikari.connectionInitSql=SET SESSION sql_require_primary_key=0
spring.jpa.open-in-view=false